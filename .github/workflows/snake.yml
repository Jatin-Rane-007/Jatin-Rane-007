name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Jatin-Rane-007
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#111514&color_dots=#ebedf0,#a8d8bf,#6fc39a,#3aa578,#0a6b4b
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#eef3f0&color_dots=#161b22,#1e3529,#27503c,#35a377,#5bd9a3

      - name: publish to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
